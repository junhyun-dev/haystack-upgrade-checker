# Evaluation baseline for the document-Agent workspace.
# Corpus: corpus/haystack-docs-src (Haystack docs, versions 2.31 and 3.1, Apache-2.0) + corpus/MIGRATION.md, pinned in
# corpus/haystack-docs-src.commit. Paths below are relative to corpus/haystack-docs-src/docs-website/versioned_docs/ unless noted.
# Fields:
#   version: which pinned version the asker is on ("2.31", "3.1", or "any"). For "any", both knowledge bases are searched
#            and an expected document counts as found whichever version's copy is returned (the version prefix is ignored).
#   expected_sources: documents a correct retrieval must surface (used for retrieval recall / citation checks, no LLM needed).
#   key_points: what a correct answer must state; judged by a person first, LLM judge only as a secondary signal.
#   wrong_version_trap: the document that a version-blind retrieval would pull and that would make the answer wrong.
#   split: dev (used while changing settings/code) or eval (held out, run only for before/after comparison).
# Do not add answers generated by a model here. Do not use eval items for tuning.

- id: q01
  split: dev
  version: "3.1"
  question: "I am on Haystack 3.1. My code imports ToolInvoker from haystack.components.tools and fails. What replaced it?"
  expected_sources: [version-3.1/overview/migration.mdx, version-3.1/pipeline-components/agents-1/agent.mdx]
  wrong_version_trap: version-2.31/tools/tool.mdx
  key_points: ["ToolInvoker was removed in 3.0", "pass tools to Agent; Agent executes tool calls and loops until an exit condition"]

- id: q02
  split: dev
  version: "2.31"
  question: "On Haystack 2.31, how do I execute tool calls returned by a ChatGenerator?"
  expected_sources: [version-2.31/tools/tool.mdx]
  wrong_version_trap: version-3.1/overview/migration.mdx
  key_points: ["ToolInvoker component takes the tool calls and runs the tools", "ToolInvoker(tools=[...]) wired after the chat generator"]

- id: q03
  split: dev
  version: "3.1"
  question: "Does Haystack 3.1 still have AsyncPipeline? How do I run a pipeline asynchronously?"
  expected_sources: [version-3.1/overview/migration.mdx, version-3.1/concepts/pipelines.mdx]
  wrong_version_trap: version-2.31/concepts/pipelines.mdx
  key_points: ["AsyncPipeline was merged into Pipeline", "use Pipeline.run_async / run_async_generator / stream", "sync AsyncPipeline.run() is not a drop-in for Pipeline.run()"]

- id: q04
  split: eval
  version: "2.31"
  question: "Which class do I use for concurrent async execution of a pipeline in Haystack 2.31?"
  expected_sources: [version-2.31/concepts/pipelines.mdx]
  wrong_version_trap: version-3.1/overview/migration.mdx
  key_points: ["AsyncPipeline class exists in 2.31 with run_async"]

- id: q05
  split: dev
  version: "3.1"
  question: "I installed opentelemetry-sdk but no traces appear in Haystack 3.1. Why, and how do I enable tracing?"
  expected_sources: [version-3.1/overview/migration.mdx, version-3.1/development/tracing.mdx]
  wrong_version_trap: version-2.31/development/tracing/opentelemetry.mdx
  key_points: ["tracing is no longer auto-enabled in 3.x", "add OpenTelemetryConnector or call haystack.tracing.enable_tracing", "HAYSTACK_AUTO_TRACE_ENABLED has no effect"]

- id: q06
  split: eval
  version: "3.1"
  question: "Where did SentenceTransformersDocumentEmbedder go in Haystack 3.1 and what is the import path?"
  expected_sources: [version-3.1/overview/migration.mdx]
  wrong_version_trap: version-2.31/pipeline-components/embedders.mdx
  key_points: ["moved to the sentence-transformers-haystack integration", "from haystack_integrations.components.embedders.sentence_transformers import SentenceTransformersDocumentEmbedder"]

- id: q07
  split: dev
  version: "3.1"
  question: "In Haystack 3.1, are PromptBuilder template variables optional or required by default?"
  expected_sources: [version-3.1/overview/migration.mdx, version-3.1/pipeline-components/builders/promptbuilder.mdx]
  wrong_version_trap: version-2.31/pipeline-components/builders/promptbuilder.mdx
  key_points: ["required by default in 3.x"]

- id: q08
  split: eval
  version: "2.31"
  question: "In Haystack 2.31, what happens when a PromptBuilder template variable is missing at runtime?"
  expected_sources: [version-2.31/pipeline-components/builders/promptbuilder.mdx]
  wrong_version_trap: version-3.1/overview/migration.mdx
  key_points: ["variables are optional by default unless listed in required_variables", "missing variables are replaced with empty strings"]

- id: q09
  split: dev
  version: "3.1"
  question: "After upgrading to Haystack 3.x, documents with metadata got different Document.id values. Why?"
  expected_sources: [version-3.1/overview/migration.mdx]
  wrong_version_trap: ""
  key_points: ["id hash now uses canonical key-sorted JSON of meta", "documents with empty meta keep their 2.x ids"]

- id: q10
  split: eval
  version: "3.1"
  question: "How do I make an Agent tool read a value from State by name in Haystack 3.1?"
  expected_sources: [version-3.1/overview/migration.mdx, version-3.1/pipeline-components/agents-1/state.mdx]
  wrong_version_trap: version-2.31/pipeline-components/agents-1/state.mdx
  key_points: ["declare inputs_from_state={'state_key': 'parameter_name'} explicitly", "implicit name matching was removed"]

- id: q11
  split: dev
  version: any
  question: "What does InMemoryBM25Retriever do and does it need an embedding model?"
  expected_sources: [version-3.1/pipeline-components/retrievers/inmemorybm25retriever.mdx]
  wrong_version_trap: ""
  key_points: ["keyword-based BM25 retrieval over InMemoryDocumentStore", "no embedding model needed"]

- id: q12
  split: eval
  version: any
  question: "Which DocumentSplitter settings control chunk size and overlap?"
  expected_sources: [version-3.1/pipeline-components/preprocessors/documentsplitter.mdx]
  wrong_version_trap: ""
  key_points: ["split_by, split_length, split_overlap"]
